[workspace]
resolver = "2"
members = [
    "crates/lumalens-app",
    "crates/lumalens-engine",
    "crates/lumalens-config",
    "crates/lumalens-common",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0-or-later"
rust-version = "1.85"
authors      = ["Tims <[EMAIL_ADDRESS]>"]

[workspace.dependencies]
# Internal
lumalens-common = { path = "crates/lumalens-common" }
lumalens-config = { path = "crates/lumalens-config" }
lumalens-engine = { path = "crates/lumalens-engine" }

# Third-party
gtk4              = { version = "~0.9",  features = ["v4_8"] }
libadwaita        = { version = "~0.7",  features = ["v1_4"] }
gstreamer         = { version = "~0.23" }
gstreamer-video   = { version = "~0.23" }
gstreamer-app     = { version = "~0.23" }
gst-plugin-gtk4   = { version = "~0.13", features = ["wayland", "x11egl"] }
serde             = { version = "~1",    features = ["derive"] }
toml              = { version = "~0.8" }
thiserror         = { version = "~2" }
tracing           = { version = "~0.1" }
tracing-subscriber = { version = "~0.3", features = ["env-filter"] }
