<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="22" ry="22" fill="#1c71d8"/>
  <!-- Camera body -->
  <rect x="20" y="42" width="72" height="50" rx="8" ry="8" fill="white"/>
  <!-- Lens outer ring -->
  <circle cx="56" cy="67" r="18" fill="#1c71d8"/>
  <!-- Lens inner -->
  <circle cx="56" cy="67" r="11" fill="white"/>
  <!-- Lens center -->
  <circle cx="56" cy="67" r="5" fill="#1c71d8"/>
  <!-- Viewfinder bump -->
  <rect x="44" y="34" width="24" height="12" rx="4" ry="4" fill="white"/>
  <!-- Flash / indicator dot -->
  <circle cx="84" cy="52" r="5" fill="#f6d32d"/>
  <!-- Videocam wing -->
  <polygon points="92,52 116,42 116,92 92,82" fill="white"/>
</svg>
